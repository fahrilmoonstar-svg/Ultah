<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0a2e, #2d1b4e, #1a0a2e);
            padding: 20px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 107, 160, 0.3);
        }

        h1 span {
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            color: #a0a0c0;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* ===== KUE + LILIN ===== */
        .cake-area {
            position: relative;
            width: 200px;
            height: 180px;
            margin: 0 auto 25px;
            cursor: pointer;
        }

        /* Badan Kue */
        .cake-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 70px;
            background: linear-gradient(to bottom, #d4a373, #b5835a);
            border-radius: 10px 10px 20px 20px;
            box-shadow: 0 8px 0 #8b6b4a;
        }

        /* Layer Krim */
        .cream {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 20px;
            background: #f8e8d0;
            border-radius: 20px 20px 0 0;
        }

        /* Lilin */
        .candle {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 40px;
            background: linear-gradient(to right, #ff6b6b, #ee5a24);
            border-radius: 4px 4px 2px 2px;
            transition: all 0.3s ease;
        }

        /* Sumbu */
        .wick {
            position: absolute;
            bottom: 118px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background: #333;
            border-radius: 2px;
        }

        /* Api (default mati) */
        .flame {
            position: absolute;
            bottom: 125px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 0px;
            background: radial-gradient(circle, #ffdd00, #ff6b00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transition: all 0.4s ease;
            opacity: 0;
            box-shadow: 0 0 30px rgba(255, 150, 0, 0.3);
        }

        /* Api menyala */
        .flame.on {
            height: 30px;
            opacity: 1;
            animation: flicker 0.3s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1) translateY(-3px); }
        }

        /* ===== TOMBOL ===== */
        .btn-video {
            background: #ff6ba0;
            color: #1a0a2e;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px 0 15px;
            width: 100%;
            font-family: inherit;
        }

        .btn-video:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(255, 107, 160, 0.3);
        }

        /* ===== VIDEO ===== */
        .video-wrapper {
            display: none;
            margin-top: 15px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper.show {
            display: block;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 300px;
            display: block;
        }

        /* ===== CONFETTI ===== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Judul -->
        <h1>🎂 Happy <span>Birthday</span>!</h1>
        <p class="sub">✨ Untuk [Nama] yang paling spesial ✨</p>

        <!-- Area Kue + Lilin (klik buat nyalain) -->
        <div class="cake-area" id="cakeArea">
            <div class="cake-body"></div>
            <div class="cream"></div>
            <div class="candle" id="candle"></div>
            <div class="wick"></div>
            <div class="flame" id="flame"></div>
        </div>

        <!-- Tombol Putar Video -->
        <button class="btn-video" id="playBtn">🎵 Putar Lagu Ulang Tahun</button>

        <!-- Video Player -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="birthdayVideo" controls>
                <!-- INI YANG DIGANTI JADI video1.mp4 -->
                <source src="video1.mp4" type="video/mp4">
                Browser Anda tidak mendukung video.
            </video>
        </div>

        <p class="footer">💖 Klik lilin untuk menyalakan!</p>
    </div>

    <!-- Container Confetti -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // ===== FITUR LILIN NYALA =====
        const flame = document.getElementById('flame');
        const cakeArea = document.getElementById('cakeArea');
        let isLit = false;

        cakeArea.addEventListener('click', function() {
            isLit = !isLit;
            if (isLit) {
                flame.classList.add('on');
                triggerConfetti(); // Confetti muncul pas lilin nyala
            } else {
                flame.classList.remove('on');
            }
        });

        // ===== FITUR VIDEO =====
        const playBtn = document.getElementById('playBtn');
        const videoWrapper = document.getElementById('videoWrapper');
        const video = document.getElementById('birthdayVideo');

        playBtn.addEventListener('click', function() {
            if (videoWrapper.classList.contains('show')) {
                // Sembunyikan video
                videoWrapper.classList.remove('show');
                video.pause();
                playBtn.textContent = '🎵 Putar Lagu Ulang Tahun';
            } else {
                // Tampilkan video
                videoWrapper.classList.add('show');
                video.play();
                playBtn.textContent = '⏸️ Hentikan Lagu';
            }
        });

        // Saat video selesai, tombol berubah
        video.addEventListener('ended', function() {
            playBtn.textContent = '🎵 Putar Lagu Ulang Tahun';
            // Video tetap ditampilkan, tapi tombol berubah
        });

        // ===== CONFETTI =====
        function triggerConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ff6b6b', '#feca57', '#54a0ff', '#ff6ba0', '#a855f7', '#4ade80', '#fbbf24'];

            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.width = (Math.random() * 8 + 4) + 'px';
                confetti.style.height = (Math.random() * 8 + 4) + 'px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                confetti.style.animationDelay = (Math.random() * 0.8) + 's';
                container.appendChild(confetti);

                // Hapus confetti setelah animasi selesai
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // Confetti otomatis saat halaman dibuka (opsional)
        // triggerConfetti();
    </script>

</body>
</html>
